; Tornado Redemption 1.7 settings. Put this file next to TornadoRedemption.asi in the game folder (the folder with RDR2.exe).
; Everything here can also be changed in the in-game menu; this file sets what you start with.
; Menu -> Tests & tools -> Advanced -> "Reload TornadoRedemption.ini" applies changes without restarting the game.

[Defaults]
; What a new game session starts with.
; Style: Vortex, Wedge, Column, Rope, Toon (a cartoon twister: a wobbling tube with stripes climbing it),
;        and new in 1.2: Dust (a desert dust devil), Fire (a firenado, glowing), Ghost (pale, lit cold blue), Snow (a snow devil),
;        Waterspout (mist and spray), Multi (three funnels circling in one), Junk (a funnel made of flying junk)
Style=Wedge
; Strength: Gentle, Violent, Extreme
Strength=Violent
; FunnelSize: Small, Medium, Large
FunnelSize=Medium
; Speed: Slow, Normal, Fast
Speed=Normal
; Movement: Stationary, Wander, TowardYou, StraightLine
Movement=TowardYou
; Reach (how far out it pulls things in): Medium, Large, Huge, Massive
Reach=Huge
; Arthur: Immune, Tugged (dragged about, escapable), Grabbable (it can carry him off), EasyPrey (rides it high)
Arthur=Grabbable
; FlingAndChase: after 10-18 s inside, it throws Arthur out and keeps coming (1 = on, 0 = off)
FlingAndChase=1
; ArthurInvincible: 1 = no damage at all. 0 (the default since 1.3) = rough landings and flying debris hurt him.
ArthurInvincible=0
; Landings when it throws or drops Arthur: Soft (always caught - now and then a long glide down), Mixed (caught or hard - he hits
; the ground in a heap and it hurts - or the stratosphere, sky-high, a far throw, a far glide, slammed down, or a meteor into the
; ground that doesn't hurt; never kills him), Real (no catch at all)
Landings=Mixed
; ThrowAtArthur: now and then it hurls a plank or a barrel at him (or just short), and more of its debris comes his way (1 = on)
ThrowAtArthur=1
; TownSafety: in the big towns the street furniture (lamp posts, poles, fences) stays put - Saint Denis crashed the game
; three times when the tornado ripped it up and carried it off (1 = on, recommended)
TownSafety=1
; TouchdownCamera / RideCamera: the camera shows each touchdown, and circles Arthur when he's lifted - every other ride it eases
; out to show the funnel round him, then back (a throw ends it) (1 = on, 0 = off)
TouchdownCamera=1
RideCamera=1
; RealTrees: it finds the map's real trees in its path, makes them vanish and tears out a stand-in (experimental; 1 = on)
RealTrees=1
; FlattenGrass: grass and bushes are flattened along its track (1 = on)
FlattenGrass=1
; StormSeason: tornadoes that turn up on their own - Off, Rare (every 12-25 min), Regular (6-12), Frequent (2.5-5)
StormSeason=Off

[Performance]
; High (fast PCs), Balanced (default), or Low (slower PCs: fewer smoke effects, puffs, flying props and grabs).
Mode=Balanced

[Storm]
; Weather override while a tornado is out: Off (leave your weather alone), StormClouds (dark, no rain), Thunderstorm, Rain.
Weather=StormClouds
; The game's own wind howls louder the closer the tornado gets (1 = on, 0 = off).
WindRoar=1
; Darkens the light while a storm is out, so the funnel stands out (Rockstar's own stormy-sky grade; 1 = on, 0 = off).
DarkSky=1
WindSpeed=12.0
CameraShakeName=HAND_SHAKE
CameraShakeMax=2.5

[Sound]
; The tornado's own roar, made by the mod (a deep rumble, gusts, a howl, cracks of debris - no samples): Off, Quiet, Normal, Loud.
; Quiet is the default since 1.4 (and every level is quieter than before).
TornadoRoar=Quiet
; Overall roar volume, 0.0 - 1.5
RoarVolume=0.8
; The game's own action music while a tornado is out, like a mission: Off, HideoutFight, BraithwaiteBattle, OutlawAmbush,
; HostageRescue, HorseChase, NativeSonStorm. It's Rockstar's score: it may be claimed on YouTube.
MissionMusic=Off
; Voices: Arthur, the gang and passers-by react out loud with the game's own lines, strung into little exchanges.
; Off, Arthur (only him), Everyone
Voices=Everyone
; How often they talk: Rare, Normal, Chatty
Chatter=Normal
; Ask the game to show its own subtitle for each line, where the line has one (1 = on)
VoiceSubtitles=1
; When a storm is over: a card with who it took, the trees it tore out and how long and how high Arthur rode it (1 = on)
StormReport=1

[Intro]
; "The intro: Storm Chasers" (menu -> Modes & toys). The camp it opens in: All = Rockstar's own camp at Horseshoe Overlook (the map
; pieces the game's camp script uses, put back afterwards), Base = only its base layout, None = the mod's own props.
CampMap=All

[Balloon]
; Which way the jet flames point (0-3). In flight, the next-step key (N / RB+A) cycles them and the log notes your pick.
JetAim=0

[UI]
; RDR2 = the game's own menu art, fonts and sounds. Simple = the plain boxes of v1.0 (if anything looks wrong on your setup).
Style=RDR2

[HUD]
; Tracker = a slim compass at the top centre (where the tornado is, how far, closing or not). Full = developer info.
; Off = nothing (cinematic mode also hides the game's HUD).
Mode=Tracker

[Keys]
; Key names: letters/digits, BACKSLASH LBRACKET RBRACKET SEMICOLON QUOTE COMMA PERIOD SLASH MINUS EQUALS GRAVE
;            UP DOWN LEFT RIGHT ENTER BACKSPACE DELETE INSERT HOME END PGUP PGDN SPACE TAB, or 0x hex codes.
; Combine with CTRL+ / SHIFT+ / ALT+  e.g.  Menu=CTRL+BACKSLASH
Menu=BACKSLASH
QuickSpawn=RBRACKET
DespawnAll=LBRACKET
; Saves a note (with the current tornado state) to TornadoRedemption_findings.txt.
Bookmark=SEMICOLON
; Hides every mod label and the game HUD for clean footage (press again to bring them back).
Cinematic=QUOTE
; Cycles the camera: normal -> drone orbit -> low angle -> over Arthur's shoulder -> normal.
DroneCam=PERIOD
; Skips to the next step of a running test (style tour etc.).
NextStep=N
MenuUp=UP
MenuDown=DOWN
MenuLeft=LEFT
MenuRight=RIGHT
MenuSelect=ENTER
MenuBack=BACKSPACE

[Controller]
; Xbox-style names: A B X Y LB RB LS RS BACK START DPAD_UP DPAD_DOWN DPAD_LEFT DPAD_RIGHT
; (PlayStation names work too: CROSS CIRCLE SQUARE TRIANGLE L1 R1 L3 R3 OPTIONS).
; "RB+DPAD_RIGHT" = hold RB, then press D-pad right. Inside the menu: D-pad moves/changes, A selects, B goes back.
Enabled=1
Menu=RB+DPAD_RIGHT
QuickSpawn=RB+DPAD_UP
DespawnAll=RB+DPAD_DOWN
Cinematic=RB+DPAD_LEFT
DroneCam=RB+Y
Note=RB+X
NextStep=RB+A

[Physics]
; How many things each tornado can push at once (people and wagons are picked before props). Performance caps this
; to 110 (Balanced) or 70 (Low).
MaxEntitiesPerTornado=150
; How quickly things match the vortex speed (per second). Higher = snappier / more violent.
VelocityGain=2.5
; Multiplier for the "Force" push method.
ForceGain=1.0

[Visuals]
; The game runs out at about 126 looping effects in total. Tornadoes share this budget (Balanced caps it at 80, Low at 50).
LoopedEffectBudget=110
; One-shot smoke/dust puffs per second (Balanced x0.8, Low x0.5). If the game refuses some, the mod backs off by itself.
PuffsPerSecond=70
; Tilt (degrees) of the train-smoke streamers aimed along the spin. -60 and 0 both swirl (playtest 8's Spin check).
StreamerPitch=-60

[Overlay]
; (HUD Full only) left edge of the developer info box.
X=0.33
Y=0.015

[Debug]
; Write a status line for every tornado to TornadoRedemption.log this often (seconds). 0 = off.
AutoLogSeconds=5
; Legacy funnel engine only: how its invisible particle anchors are hidden (0 visible, 1 invisible, 2 alpha 0)
; and their draw distance.
AnchorHideMode=1
AnchorLodDist=1500
